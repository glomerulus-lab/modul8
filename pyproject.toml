[project]
name = "modul8"
version = "0.1.0"
description = "Three-factor Hebbian learning for standard PyTorch layers, via hooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
