[project]
name = "modul8"
version = "0.1.0"
description = "Three-factor Hebbian learning for standard PyTorch layers, via hooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.6.0", "torchvision"]
cu124 = ["torch>=2.6.0", "torchvision"]
cu134 = ["torch>=2.6.0", "torchvision"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu124" }, { extra = "cu134" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu134", extra = "cu134" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu134", extra = "cu134" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
examples = [
    "matplotlib>=3.10.9",
    "torchvision",
]
